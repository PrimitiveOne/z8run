name: Release

# Manual only: Actions -> Release -> Run workflow.
# Automatic releases on version tags are DISABLED. Re-enabling them needs the
# `tag` input below to fall back to github.ref_name.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.3.0 (created on the selected commit if missing)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true
      docker:
        description: "Build and push Docker images to GHCR"
        type: boolean
        default: false
      crates:
        description: "Publish crates to crates.io"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_Z8RUN: ghcr.io/${{ github.repository }}-api
  IMAGE_NGINX: ghcr.io/${{ github.repository }}-nginx
  TAG: ${{ inputs.tag }}

jobs:
  # ── Validate the tag ───────────────────────────────────
  check:
    name: Check inputs
    runs-on: ubuntu-latest
    steps:
      - name: Tag must look like vMAJOR.MINOR.PATCH
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

  # ── Build Docker images with version tag ───────────────
  docker:
    name: Docker Images
    needs: check
    if: inputs.docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push z8run API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_Z8RUN }}:latest
            ${{ env.IMAGE_Z8RUN }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_Z8RUN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile.nginx
          push: true
          tags: |
            ${{ env.IMAGE_NGINX }}:latest
            ${{ env.IMAGE_NGINX }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NGINX }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build standalone binaries (web UI embedded) ────────
  binaries:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: z8run-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: z8run-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: z8run-windows-x86_64
            exe: .exe
    defaults:
      run:
        shell: bash
    env:
      BIN: target/${{ matrix.target }}/release/z8run${{ matrix.exe }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web UI
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --bin z8run --features embed-ui --target ${{ matrix.target }}

      # Start the real artifact with no configuration and check that both
      # the API and the embedded editor answer.
      - name: Smoke test
        env:
          Z8_NO_BROWSER: "1"
        run: |
          "$BIN" --version
          # Relative paths: the same for bash and the native binary on Windows.
          "$BIN" --data-dir z8-smoke serve --port 7799 > z8-smoke.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:7799/api/v1/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7799/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:7799/flows/smoke
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7799/api/v1/nope)" = 404
          test -s z8-smoke/secrets/jwt.key
          kill "$pid" || true

      - name: Show server log
        if: failure()
        run: cat z8-smoke.log || true

      - name: Package
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN" dist/z8run.exe
            (cd dist && 7z a -tzip ${{ matrix.artifact }}.zip z8run.exe > /dev/null && rm z8run.exe)
            file=${{ matrix.artifact }}.zip
          else
            cp "$BIN" dist/${{ matrix.artifact }}
            chmod +x dist/${{ matrix.artifact }}
            file=${{ matrix.artifact }}
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
          cat "$file.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  # ── Publish to crates.io ─────────────────────────────
  crates:
    name: Publish to crates.io
    needs: check
    if: inputs.crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates (in dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          publish_crate() {
            local crate=$1
            local version=$(cargo metadata --no-deps --format-version=1 | jq -r ".packages[] | select(.name==\"$crate\") | .version")

            # Skip if already published
            if cargo search "$crate" 2>/dev/null | grep -q "\"$version\""; then
              echo "✓ $crate@$version already published, skipping"
              return 0
            fi

            echo "📦 Publishing $crate@$version..."
            for attempt in 1 2 3; do
              if cargo publish -p "$crate" 2>&1; then
                echo "✓ $crate@$version published"
                return 0
              fi
              echo "⏳ Attempt $attempt failed, waiting 60s..."
              sleep 60
            done
            echo "⚠ $crate failed after 3 attempts, continuing..."
          }

          for crate in z8run-core z8run-protocol z8run-storage z8run-runtime z8run-api z8run-cli; do
            publish_crate "$crate"
            sleep 30
          done

  # ── Create GitHub Release ──────────────────────────────
  release:
    name: Create Release
    needs: [binaries, docker, crates]
    # docker/crates may be skipped; any failure stops the release.
    if: ${{ !cancelled() && needs.binaries.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
