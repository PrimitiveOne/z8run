# ─────────────────────────────────────────────────────────
# TLS termination model
# ─────────────────────────────────────────────────────────
# This template listens on plain HTTP (port 80) only. TLS is expected to be
# terminated UPSTREAM — e.g. by Cloudflare, an AWS/GCP load balancer, or an
# ingress controller — which forwards traffic here over the internal network.
# The `X-Forwarded-Proto $scheme` headers below let the backend detect the
# original scheme.
#
# If you instead want Nginx to terminate TLS directly, add a `server` block
# that `listen 443 ssl;`, point `ssl_certificate` / `ssl_certificate_key` at
# your certs, and turn the port-80 app/landing blocks into a redirect:
#
#     server {
#         listen 80;
#         server_name app.z8run.org z8run.org www.z8run.org;
#         return 301 https://$host$request_uri;   # force HTTPS
#     }
#
# Only enable the Strict-Transport-Security (HSTS) header (see below) once TLS
# is actually being served end-to-end, otherwise browsers may pin an https
# upgrade for a host that is still plain HTTP.
# ─────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────
# Client IP and rate limiting
# ─────────────────────────────────────────────────────────
# The backend rate-limits per client IP. Behind this proxy every TCP
# connection comes from Nginx, so the backend runs with Z8_TRUST_PROXY=true
# and reads X-Forwarded-For only when the peer is a trusted proxy
# (Z8_TRUSTED_PROXIES, private ranges by default).
#
# Each location below OVERWRITES X-Forwarded-For with $remote_addr instead of
# appending to what the client sent, so a client cannot inject addresses.
#
# Topology A - clients connect straight to Nginx:
#   Nothing else to do. $remote_addr is the client.
#
# Topology B - Cloudflare (or another CDN) in front of Nginx:
#   $remote_addr would be a Cloudflare edge, so every visitor behind the same
#   edge would share one quota. Uncomment the block in the app server below so
#   Nginx replaces $remote_addr with CF-Connecting-IP, but only for requests
#   that really come from Cloudflare. Keep the ranges current
#   (https://www.cloudflare.com/ips/) and firewall the origin so it only
#   accepts Cloudflare, otherwise the header can be forged by going direct.
# ─────────────────────────────────────────────────────────

upstream z8run_backend {
    server z8run:7700;
}

# ── app.z8run.org - The application ──────────────────────
server {
    listen 80;
    server_name app.z8run.org;

    # Topology B (Cloudflare in front): trust CF-Connecting-IP from CF only.
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;

    # Frontend (SPA)
    location / {
        root /var/www/html;
        try_files $uri $uri/ /index.html;
    }

    # API routes
    location /api/ {
        proxy_pass         http://z8run_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Auth routes
    location /auth/ {
        proxy_pass         http://z8run_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Hook routes
    location /hook/ {
        proxy_pass         http://z8run_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass         http://z8run_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Content-Security-Policy for the single-page app. The SPA talks only to
    # same-origin /api, /auth, /hook and the /ws WebSocket, so 'self' plus
    # ws:/wss: for connect-src covers it. Kept intentionally permissive
    # (style-src allows 'unsafe-inline' for injected styles) to avoid breaking
    # the app — TUNE THIS PER DEPLOYMENT (tighten script-src/style-src, add any
    # external API or CDN origins you actually use).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; base-uri 'self'; frame-ancestors 'self'" always;

    # HSTS — enable ONLY once TLS is served end-to-end (see the TLS note at the
    # top of this file). Leaving it commented prevents it being sent over plain
    # HTTP, which would wrongly force https upgrades.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ── z8run.org - Landing page ─────────────────────────────
server {
    listen 80;
    server_name z8run.org www.z8run.org;

    location / {
        root /var/www/landing;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Static landing site: same-origin only. Tune per deployment if you add
    # external assets, analytics, or fonts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; base-uri 'self'; frame-ancestors 'self'" always;

    # HSTS — enable ONLY once TLS is served end-to-end (see the TLS note above).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ── Catch-all: redirect to z8run.org ─────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 301 https://z8run.org$request_uri;
}
